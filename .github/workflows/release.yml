name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish src/prompt-lab.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o dist
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash "dist/PromptLab.exe" -Algorithm SHA256).Hash
          "$h  PromptLab.exe" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromptLab.exe
            SHA256SUMS.txt